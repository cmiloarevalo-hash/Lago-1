" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">1  Continúas leyendo la Biblia offline.</text><text x="24" y="398" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">2  El reproductor no tapa el texto.</text><text x="24" y="444" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">3  Puedes plegarlo a un icono discreto.</text><text x="24" y="490" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">4  Reproducir requiere conexión real</text><text x="24" y="536" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">   y permisos de Spotify.</text><text x="24" y="582" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">5  Si no se conecta: Abrir Spotify ↗</text></svg>