<svg xmlns="http://www.w3.org/2000/svg" width="420" height="820" viewBox="0 0 420 820" role="img"><title>Nota solo lectura tras tocar bolita</title><rect x="0" y="0" width="420" height="820" rx="0" fill="#FFFFFF" stroke="none"/><rect x="0" y="0" width="420" height="30" rx="0" fill="#F3F3F7" stroke="none"/><text x="18" y="21" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#171936" text-anchor="start">12:07</text><text x="354" y="21" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#171936" text-anchor="start">5G 90%</text><text x="22" y="70" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#171936" text-anchor="start">La U</text><text x="22" y="91" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#6C7189" text-anchor="start">RV1909 · sin conexión</text><text x="320" y="72" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#45419D" text-anchor="start">⚙ Ajustes</text><line x1="0" y1="108" x2="420" y2="108" stroke="#D8DCEB"/><rect x="0" y="755" width="420" height="65" rx="0" fill="#FFFFFF" stroke="none"/><line x1="0" y1="755" x2="420" y2="755" stroke="#D8DCEB"/><text x="55" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#6C7189" text-anchor="middle">◉</text><text x="55" y="805" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#6C7189" text-anchor="middle">Hoy</text><text x="159" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#6C7189" text-anchor="middle">⌕</text><text x="159" y="805" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#6C7189" text-anchor="middle">Explorar</text><rect x="216" y="762" width="94" height="50" rx="10" fill="#E0E7FF" stroke="none"/><text x="263" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#45419D" text-anchor="middle">▤</text><text x="263" y="805" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#45419D" text-anchor="middle">Leer</text><text x="367" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#6C7189" text-anchor="middle">▣</text><text x="367" y="805" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#6C7189" text-anchor="middle">Biblioteca</text><text x="24" y="158" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#171936" text-anchor="start">Deuteronomio 26</text><rect x="23" y="201" width="366" height="110" rx="10" fill="#FCE1EA" stroke="none"/><text x="35" y="235" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#171936" text-anchor="start">2   Este versículo tiene nota</text><text x="35" y="260" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#171936" text-anchor="start">     guardada en el dispositivo.</text><circle cx="396" cy="220" r="4" fill="#C88CA9" stroke="none" stroke-width="1"/><rect x="0" y="363" width="420" height="392" rx="24" fill="#FFFFFF" stroke="#D8DCEB"/><rect x="188" y="372" width="44" height="4" rx="3" fill="#D8DCEB" stroke="none"/><text x="24" y="414" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#171936" text-anchor="start">Deuteronomio 26:2 · RV1909</text><rect x="20" y="437" width="380" height="235" rx="12" fill="#F6F7FC" stroke="#D8DCEB"/><text x="35" y="470" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#45419D" text-anchor="start">Tu nota privada</text><text x="35" y="506" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">Este versículo me recuerda la importancia</text><text x="35" y="532" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">de poner a Dios primero en mi vida.</text><text x="35" y="558" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">Quiero conservar esta reflexión y verla</text><text x="35" y="584" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">completa cuando regrese a leer.</text><text x="35" y="610" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">Aquí no aparecen colores ni opciones</text><text x="35" y="636" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">de destacado: solo la nota.</text><text x="378" y="664" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#45419D" text-anchor="end">Expandir ↗</text><rect x="22" y="691" width="181" height="44" rx="10" fill="#FFFFFF" stroke="#45419D"/><rect x="216" y="691" width="181" height="44" rx="10" fill="#E0E7FF" stroke="none"/><text x="111" y="720" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#45419D" text-anchor="middle">Cerrar</text><text x="304" y="720" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#45419D" text-anchor="middle">✎  Editar</text></svg>