ont-size="13" font-weight="normal" fill="#45419D" text-anchor="middle">Leer</text><text x="367" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#6C7189" text-anchor="middle">▣</text><text x="367" y="805" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#6C7189" text-anchor="middle">Biblioteca</text><text x="26" y="151" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#171936" text-anchor="start">Deuteronomio 26</text><text x="30" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#171936" text-anchor="start">1   ...y habitares en ella;</text><rect x="28" y="213" width="347" height="93" rx="10" fill="#FCE1EA" stroke="none"/><text x="37" y="240" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#171936" text-anchor="start">2   Un versículo destacado</text><text x="37" y="268" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#171936" text-anchor="start">     con nota personal guardada.</text><circle cx="389" cy="236" r="4" fill="#C88CA9" stroke="none" stroke-width="1"/><rect x="0" y="317" width="420" height="438" rx="25" fill="#FFFFFF" stroke="#D8DCEB"/><rect x="188" y="328" width="44" height="4" rx="3" fill="#D8DCEB" stroke="none"/><text x="22" y="366" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#171936" text-anchor="start">Deuteronomio 26:2 · RV1909</text><rect x="20" y="387" width="380" height="203" rx="13" fill="#FFF5F8" stroke="#E8C6D6"/><text x="36" y="415" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#A83264" text-anchor="start">Tu nota privada</text><text x="343" y="415" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#45419D" text-anchor="start">✎</text><text x="379" y="415" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#A83264" text-anchor="start">▣</text><text x="36" y="453" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">Este versículo me recuerda la importancia</text><text x="36" y="477" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">de dar lo primero a Dios. Aquí puedo leer</text><text x="36" y="501" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">mis pensamientos personales, incluso si</text><text x="36" y="525" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#171936" text-anchor="start">la nota es extensa y requiere ampliarla.</text><text x="379" y="574" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#45419D" text-anchor="end">Ver completa ↗</text><rect x="70" y="600" width="281" height="38" rx="10" fill="#FFFFFF" stroke="#45419D"/><text x="210" y="625" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#45419D" text-anchor="middle">▯  Guardar referencia</text><line x1="20" y1="649" x2="400" y2="649" stroke="#D8DCEB"/><text x="24" y="677" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#171936" text-anchor="start">Destacado</text><circle cx="60" cy="705" r="18" fill="#FCE1EA" stroke="#A83264" stroke-width="2.4"/><text x="60" y="711" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#A83264" text-anchor="middle">✓</text><text x="60" y="741" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#6C7189" text-anchor="middle">Rosa</text><circle cx="153" cy="705" r="18" fill="#E0E7FF" stroke="#D8DCEB" stroke-width="1"/><text x="153" y="741" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#6C7189" text-anchor="middle">Lavanda</text><circle cx="246" cy="705" r="18" fill="#FFE6CE" stroke="#D8DCEB" stroke-width="1"/><text x="246" y="741" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#6C7189" text-anchor="middle">Durazno</text></