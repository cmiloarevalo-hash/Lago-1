name: Temporary Expo lock refresh
on:
  pull_request:
    paths:
      - '.github/workflows/refresh-expo-lock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bible-topic-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lock metadata for Expo baseline
        run: |
          npm install expo@~57.0.31 expo-notifications@~57.0.24 --package-lock-only --no-audit --no-fund
      - name: Emit generated lock for isolated commit
        run: |
          node -e 'const fs=require("fs");console.log("REFRESH_LOCK_BEGIN"+JSON.stringify(fs.readFileSync("package-lock.json","utf8"))+"REFRESH_LOCK_END");console.log("REFRESH_PKG_BEGIN"+JSON.stringify(fs.readFileSync("package.json","utf8"))+"REFRESH_PKG_END")'
