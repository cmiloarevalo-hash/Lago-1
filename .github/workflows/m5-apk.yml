name: M5 Android APK

on:
  pull_request:
    paths:
      - 'apps/bible-topic-explorer/**'
      - '.github/workflows/m5-apk.yml'
  # 2026-10-09: Human-authorized phone QA release for RC02 A1-A6 fixes,
  # on verified M2 source (103/103). Deliberate single candidate v1.1.2/code4.
  # Routine app pushes still cannot trigger release APK builds.
  push:
    branches: [main]
    paths:
      - '.github/workflows/m5-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bible-topic-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bible-topic-explorer/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/platform-tools/adb" version
      - name: Install dependencies
        run: npm ci
      - name: Regression typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Expo dependency check
        run: npx expo install --check
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build release APK
        run: |
          # Hosted runners may need more than 10 seconds to download the Gradle distribution.
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          # Retry transient Maven/JetBrains/GitHub 5xx and network download failures.
          cd android
          for attempt in 1 2 3 4; do
            if ./gradlew assembleRelease --no-daemon --max-workers=2; then
              echo "Gradle release APK assembled on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Gradle failed after 4 attempts"
              exit 1
            fi
            echo "Gradle transient failure on attempt $attempt; retrying"
            sleep $((attempt * 15))
          done
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Biblia-Guia-Pastoral-Reina-Valera-1909-v1.11.5-REVISION.apk
      - name: SHA-256 candidate APK
        run: sha256sum Biblia-Guia-Pastoral-Reina-Valera-1909-v1.11.5-REVISION.apk | tee Biblia-Guia-Pastoral-Reina-Valera-1909-v1.11.5-REVISION.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Guia-Pastoral-RV1909-v1.11.5-APK
          path: |
            apps/bible-topic-explorer/Biblia-Guia-Pastoral-Reina-Valera-1909-v1.11.5-REVISION.apk
            apps/bible-topic-explorer/Biblia-Guia-Pastoral-Reina-Valera-1909-v1.11.5-REVISION.apk.sha256
          if-no-files-found: error
          retention-days: 90
