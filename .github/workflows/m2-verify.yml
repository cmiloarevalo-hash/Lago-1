name: M2 verification

on:
  pull_request:
    paths:
      - 'apps/bible-topic-explorer/**'
      - '.github/workflows/m2-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bible-topic-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bible-topic-explorer/package-lock.json
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated package lock
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bible-topic-explorer/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "ci: regenerate package lock [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Expo dependency check
        run: npx expo install --check
      - name: Expo Android runtime bundle smoke
        run: npx expo export --platform android --output-dir dist-smoke
